services:
  bracket:
    build: .
    image: bracket:latest
    container_name: bracket
    restart: unless-stopped
    ports:
      # 8083, damit Bracket neben Kässeli (8080) und Reisli (8081) auf derselben NAS laufen kann
      - "8083:8083"
    volumes:
      # Daten bleiben ausserhalb des Containers (auf der Synology z.B. /volume1/docker/bracket/data)
      - ./data:/data
      # Programmcode direkt aus diesem Git-Ordner: «Setup → Über Bracket → Nach Updates suchen» holt neue Versionen
      # ohne Neubau des Containers. Wer das nicht will: diese Zeile entfernen und UPDATE_ENABLED=false setzen.
      - ./:/app
    environment:
      - TZ=Europe/Zurich
      # Über Cloudflare erkennt Bracket HTTPS von selbst. "true" nur, wenn es NIE per http://NAS-IP:8083 genutzt wird
      - COOKIE_SECURE=false
      # Nach «Aktualisieren» neu starten (Docker startet den Container automatisch wieder)
      - RESTART_ON_UPDATE=true
